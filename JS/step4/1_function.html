<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수(function) - 초급</title>
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="js/1_function.js"></script>
</head>
<body>
    <button type="button" id="case10">인사받고싶어?</button>
    <!-- 
    - button은 기본적으로 전송 기능을 가지고 있어 이벤트를 걸어버리면 이벤트가 씹힘. a, summit, button 이하 동문. 
    - 즉, 동적인 요소를 가동시키고 싶은 거면 기본 기능이 없는 요소를 사용할 것 (ex.button type="button")
    + 추가적으로 공부해볼 것 > e.preventDefault
    -->
</body>
